name: Build Bee-Assist APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Siapkan sumber
        id: src
        run: |
          [ -f BeeAssist-project.zip ] && unzip -q -o BeeAssist-project.zip -d _src || true
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Ganti nama APK
        run: cp "${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Bee-Assist.apk
      - uses: actions/upload-artifact@v4
        with: { name: Bee-Assist-apk, path: Bee-Assist.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bee-Assist build ${{ github.run_number }}
          files: Bee-Assist.apk
